<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopLite — Sản phẩm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="ShopLite - Trang chủ">Shop<span>Lite</span></a>

      <form class="search" role="search" action="#" onsubmit="return false;">
        <label for="search-input" class="visually-hidden">Tìm kiếm sản phẩm</label>
        <input type="search" id="search-input" name="q" placeholder="Tìm kiếm sản phẩm...">
        <button type="submit">Tìm</button>
      </form>

      <a href="#" class="cart" aria-label="Giỏ hàng, 3 sản phẩm">
        <svg class="cart-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L22 7H6"/>
          <circle cx="10" cy="20" r="1.5" fill="currentColor"/>
          <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
        </svg>
        <span class="cart-badge">3</span>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="products" aria-labelledby="products-title">
      <h1 id="products-title">Sản phẩm</h1>

      <!-- Lưới sản phẩm: ngày 2 sẽ lấp đầy -->
      <div class="product-grid">
        <article class="product-card">
          <div class="product-thumb" aria-hidden="true"></div>
          <h2 class="product-name">Sản phẩm 1</h2>
          <p class="product-price">0₫</p>
        </article>
        <article class="product-card">
          <div class="product-thumb" aria-hidden="true"></div>
          <h2 class="product-name">Sản phẩm 2</h2>
          <p class="product-price">0₫</p>
        </article>
        <article class="product-card">
          <div class="product-thumb" aria-hidden="true"></div>
          <h2 class="product-name">Sản phẩm 3</h2>
          <p class="product-price">0₫</p>
        </article>
        <article class="product-card">
          <div class="product-thumb" aria-hidden="true"></div>
          <h2 class="product-name">Sản phẩm 4</h2>
          <p class="product-price">0₫</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <section class="footer-info">
        <h2>ShopLite</h2>
        <address>
          123 Đường ABC, Quận 1, TP. Hồ Chí Minh<br>
          Hotline: <a href="tel:0123456789">0123 456 789</a><br>
          Email: <a href="mailto:hello@shoplite.example">hello@shoplite.example</a>
        </address>
      </section>

      <nav class="footer-links" aria-label="Liên kết chân trang">
        <ul>
          <li><a href="#">Giới thiệu</a></li>
          <li><a href="#">Chính sách đổi trả</a></li>
          <li><a href="#">Vận chuyển</a></li>
          <li><a href="#">Liên hệ</a></li>
        </ul>
      </nav>
    </div>
    <p class="copyright">&copy; 2026 ShopLite. All rights reserved.</p>
  </footer>
</body>
</html>
